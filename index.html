<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChaloOnline APK Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>ChaloOnline APK Builder</h1>
  <form id="apkForm">
    <label for="retailer_name">Retailer Shop Name:</label>
    <input type="text" id="retailer_name" name="retailer_name" required />

    <label for="tenant_id">Tenant ID:</label>
    <input type="text" id="tenant_id" name="tenant_id" required />

    <label for="package_suffix">Retailer Package Name (small letters only):</label>
    <input type="text" id="package_suffix" name="package_suffix" required />

    <label for="start_color">Start Gradient Color:</label>
    <input type="text" id="start_color" name="start_color" required />

    <label for="center_color">Center Gradient Color:</label>
    <input type="text" id="center_color" name="center_color" required />

    <label for="end_color">End Gradient Color:</label>
    <input type="text" id="end_color" name="end_color" required />

    <label for="button_color">Button Text Color:</label>
    <input type="text" id="button_color" name="button_color" required />

    <label for="white_button_color">White Button Text Color:</label>
    <input type="text" id="white_button_color" name="white_button_color" required />

    <label for="image_url">Retailer Logo Image URL (.png preferred):</label>
    <input type="url" id="image_url" name="image_url" required />

    <button type="submit">Build APK</button>
  </form>

  <div id="status"></div>

  <script src="script.js"></script>
</body>
</html>
